<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Body Chrome Attach</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;width:300px;margin:0;padding:16px;background:#111827;color:#f9fafb}h1{font-size:16px;margin:0 0 8px}p{font-size:12px;line-height:1.45;color:#d1d5db;margin:6px 0 12px}input{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #4b5563;border-radius:8px;background:#1f2937;color:#fff;font-size:16px;letter-spacing:.08em;text-transform:uppercase}button{width:100%;margin-top:10px;padding:10px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:12px;padding:10px;border-radius:8px;background:#1f2937;font-size:12px;line-height:1.4}.ok{color:#86efac}.bad{color:#fca5a5}.muted{color:#9ca3af}
  </style>
</head>
<body>
  <h1>Body Chrome Attach</h1>
  <p id="hint">Mở daemon và gõ <b>pair open</b>, sau đó nhập mã một lần bên dưới.</p>
  <form id="form">
    <input id="code" autocomplete="one-time-code" maxlength="9" placeholder="ABCD-EFGH" aria-label="Mã ghép nối">
    <button id="submit" type="submit">Ghép nối</button>
  </form>
  <div id="status" class="status muted">Đang kiểm tra trạng thái…</div>
  <script src="pairing_popup.js"></script>
</body>
</html>
