name: Verify Body Chrome Attach

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: npm run verify
      - name: Check Python runtime syntax
        run: python3 -m py_compile daemon/native/windows_input.py desktop/__init__.py desktop/config.py desktop/body_client.py desktop/supervisor.py desktop/main.py tests/desktop_host_contract.py
      - name: Verify BodyBrain desktop contract
        run: python3 tests/desktop_host_contract.py
      - name: Upload Chrome BODY extension package
        uses: actions/upload-artifact@v4
        with:
          name: body-chrome-extension-${{ github.sha }}
          path: artifacts/body-chrome-attach-v*.zip
          if-no-files-found: error
          retention-days: 14

  windows-native-input:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Win32 INPUT ABI
        run: python daemon/native/windows_input.py selftest
      - name: Verify BodyBrain desktop contract on Windows
        run: python tests/desktop_host_contract.py
