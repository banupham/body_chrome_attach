name: Verify Body Chrome Attach

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Verify BODY, Desktop Host and Extension
        run: npm run verify
      - name: Check production Python syntax
        run: >-
          python3 -m py_compile
          daemon/native/windows_input.py
          desktop/__init__.py desktop/config.py desktop/paths.py desktop/host_logging.py desktop/health.py
          desktop/worker_supervisor.py desktop/lifecycle.py desktop/autostart.py desktop/body_status_client.py desktop/supervisor.py desktop/tray_ui.py desktop/main.py
          tools/build_bodybrain_release.py tools/build_body_core_test.py tools/package_guardian_module.py
          desktop/body_only_main.py
          tests/desktop_host_contract.py tests/desktop_host_foundation_contract.py tests/bodybrain_no_brain_contract.py
          tests/desktop_runtime_smoke.py tests/bodybrain_exe_smoke.py tests/bodybrain_release_manifest_contract.py
      - name: Smoke Desktop runtime without Chrome
        run: python3 tests/desktop_runtime_smoke.py

  windows-native-input:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Win32 INPUT ABI
        run: python daemon/native/windows_input.py selftest
      - name: Verify Desktop Host contracts on Windows
        run: |
          python tests/desktop_host_contract.py
          python tests/desktop_host_foundation_contract.py
          python tests/bodybrain_no_brain_contract.py

  release-windows:
    needs: [verify, windows-native-input]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Build and verify protected Chrome BODY Extension
        run: npm run extension:protected:test
      - name: Verify production excludes Brain
        run: python tests/bodybrain_no_brain_contract.py
      - name: Install release builder
        run: python -m pip install -r requirements-release.txt
      - name: Build one-file BodyBrain.exe
        run: python tools/build_bodybrain_release.py
      - name: Smoke actual BodyBrain.exe twice
        run: python tests/bodybrain_exe_smoke.py artifacts/BodyBrain.exe
      - name: Verify exact three-file release
        run: python tests/bodybrain_release_manifest_contract.py
      - name: Build separate YouTube discovery Brain executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/stamp_discovery_build.js
          if ($LASTEXITCODE -ne 0) { throw 'autodiscovery_build_metadata_failed' }
          New-Item -ItemType Directory -Force -Path 'brain-artifacts' | Out-Null
          npx --yes pkg@5.8.1 research/autonomous_discovery/entry.js --targets node18-win-x64 --output brain-artifacts/YouTubeExplorerBrain.exe
          if ($LASTEXITCODE -ne 0) { throw 'autodiscovery_brain_build_failed' }
      - name: Smoke separate YouTube discovery Brain executable
        shell: pwsh
        run: |
          & .\brain-artifacts\YouTubeExplorerBrain.exe --selftest true
          if ($LASTEXITCODE -ne 0) { throw 'autodiscovery_brain_selftest_failed' }
      - name: Upload autonomous discovery Brain
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autonomous-discovery-brain-${{ github.sha }}
          path: brain-artifacts/YouTubeExplorerBrain.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload clean BodyBrain Windows release
        uses: actions/upload-artifact@v4
        with:
          name: bodybrain-windows-release-${{ github.sha }}
          path: |
            artifacts/BodyBrain.exe
            artifacts/BodyChromeAttach-v*.zip
            artifacts/bodybrain-release-v*.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release v0.8.0-hotfix.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release BodyBrain v0.8.0-hotfix.1')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.8.0-hotfix.1'
          $extension = Get-ChildItem 'artifacts/BodyChromeAttach-v*.zip' | Select-Object -First 1
          $manifest = Get-ChildItem 'artifacts/bodybrain-release-v*.json' | Select-Object -First 1
          if (-not $extension) { throw 'protected_extension_release_missing' }
          if (-not $manifest) { throw 'release_manifest_missing' }
          $assets = @(
            (Resolve-Path 'artifacts/BodyBrain.exe').Path,
            $extension.FullName,
            $manifest.FullName
          )
          $notes = @'
          BODY-only production hotfix. Brain remains NOT_CONFIGURED and is not included in this release.

          Fixes:
          - Prevent ambiguous CDP DOM echoes from being reclassified as USER input.
          - Prevent human-labelled recorder events from reaching learning while BODY HUMAN_MOTOR execution is active.
          - Preserve the stable CDP gateway, MotorPlanner, OnlineBehaviorModel, Guardian, and existing learned BODY data.
          '@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'BodyBrain v0.8.0 Hotfix 1' --notes $notes
          }


  split-components-windows:
    needs: [verify, windows-native-input]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Verify protected BODY Extension
        run: npm run extension:protected:test
      - name: Install BODY test builder
        run: python -m pip install -r requirements-release.txt
      - name: Build and smoke BODY-only executable
        run: python tools/build_body_core_test.py
      - name: Add protected Extension to BODY artifact
        shell: pwsh
        run: |
          $extension = Get-ChildItem 'artifacts/BodyChromeAttach-v*.zip' | Select-Object -First 1
          if (-not $extension) { throw 'body_extension_missing' }
          Copy-Item $extension.FullName 'split-artifacts/body/' -Force
      - name: Package Guardian module
        run: python tools/package_guardian_module.py
      - name: Build and smoke standalone Guardian executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes pkg@5.8.1 guardian/main.js --targets node18-win-x64 --output split-artifacts/guardian/Guardian.exe
          if ($LASTEXITCODE -ne 0) { throw 'split_guardian_build_failed' }
          & .\split-artifacts\guardian\Guardian.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw 'split_guardian_selftest_failed' }
      - name: Build separate Brain executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/stamp_discovery_build.js
          New-Item -ItemType Directory -Force -Path 'split-artifacts/brain' | Out-Null
          npx --yes pkg@5.8.1 research/autonomous_discovery/entry.js --targets node18-win-x64 --output split-artifacts/brain/YouTubeExplorerBrain.exe
          if ($LASTEXITCODE -ne 0) { throw 'split_brain_build_failed' }
          & .\split-artifacts\brain\YouTubeExplorerBrain.exe --selftest true
          if ($LASTEXITCODE -ne 0) { throw 'split_brain_selftest_failed' }
      - name: Upload BODY-only component
        uses: actions/upload-artifact@v4
        with:
          name: split-body-${{ github.sha }}
          path: split-artifacts/body/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Guardian component
        uses: actions/upload-artifact@v4
        with:
          name: split-guardian-${{ github.sha }}
          path: |
            split-artifacts/guardian/Guardian.exe
            split-artifacts/guardian/GuardianModule.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Brain component
        uses: actions/upload-artifact@v4
        with:
          name: split-brain-${{ github.sha }}
          path: split-artifacts/brain/YouTubeExplorerBrain.exe
          if-no-files-found: error
          retention-days: 14
